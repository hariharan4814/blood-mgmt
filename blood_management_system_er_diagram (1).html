<style>
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<h2 class="sr-only">Entity relationship diagram for the Blood Management System, showing all twelve tables and their relationships</h2>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const def = `erDiagram
  USER ||--o| DONOR : "has profile"
  USER ||--o{ BLOODREQUEST : "raises"
  USER ||--o{ NOTIFICATION : "receives"
  USER ||--o{ AUDITLOG : "performs"
  USER ||--o{ TESTRESULT : "records"
  USER ||--o{ SOSBROADCAST : "triggers"
  BLOODBANK ||--o{ BLOODUNIT : "stores"
  BLOODBANK ||--o{ DONATIONCAMP : "organizes"
  BLOODUNIT ||--o{ TESTRESULT : "undergoes"
  BLOODUNIT ||--o| DONATION : "results from"
  DONOR ||--o{ DONATION : "makes"
  DONATIONCAMP ||--o{ DONATION : "collects"
  DONOR ||--o{ SOSRESPONSE : "responds to"
  BLOODREQUEST ||--o| SOSBROADCAST : "escalates to"
  SOSBROADCAST ||--o{ SOSRESPONSE : "generates"

  USER {
    uuid id PK
    string email
    string password_hash
    string role
    string phone
    bool is_verified
  }
  DONOR {
    uuid id PK
    uuid user_id FK
    string blood_group
    date dob
    float weight
    float latitude
    float longitude
    date last_donation_date
  }
  BLOODBANK {
    uuid id PK
    string name
    string location
    string contact
    int capacity
  }
  BLOODUNIT {
    uuid id PK
    uuid blood_bank_id FK
    string blood_group
    date collection_date
    date expiry_date
    string status
    string unit_code
  }
  TESTRESULT {
    uuid id PK
    uuid blood_unit_id FK
    uuid tested_by FK
    string test_type
    string result
    datetime tested_at
  }
  DONATIONCAMP {
    uuid id PK
    uuid blood_bank_id FK
    string location
    date date
    string organizer
    int target_units
  }
  DONATION {
    uuid id PK
    uuid donor_id FK
    uuid camp_id FK
    uuid blood_unit_id FK
    date date
  }
  BLOODREQUEST {
    uuid id PK
    uuid hospital_id FK
    string blood_group
    int units_needed
    string urgency
    string status
    uuid approved_by FK
  }
  NOTIFICATION {
    uuid id PK
    uuid user_id FK
    string message
    string type
    bool read_status
  }
  AUDITLOG {
    uuid id PK
    uuid user_id FK
    string action
    string model_affected
    datetime timestamp
  }
  SOSBROADCAST {
    uuid id PK
    uuid request_id FK
    string blood_group
    float radius_km
    uuid triggered_by FK
    datetime triggered_at
  }
  SOSRESPONSE {
    uuid id PK
    uuid broadcast_id FK
    uuid donor_id FK
    string response
    datetime responded_at
  }`;
const { svg } = await mermaid.render('erd-svg', def);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
